<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axi V0.9-TH — @dravoxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Athiti:wght@400;600;700&family=Bai+Jamjuree:wght@400;600;700&family=Chakra+Petch:wght@400;600;700&family=Charm:wght@400;700&family=Kanit:wght@400;600;700;800&family=Krub:wght@400;600;700&family=Mali:wght@400;600;700&family=Mitr:wght@400;600;700&family=Niramit:wght@400;600;700&family=Prompt:wght@400;600;700&family=Sarabun:wght@400;600;700&family=Thasadith:wght@400;700&family=K2D:wght@400;600;700&family=Itim&family=Chonburi&family=Pattaya&family=Srisakdi:wght@400;700&family=Charmonman:wght@400;700&family=Fahkwang:wght@400;600;700&family=Pridi:wght@400;600;700&family=Taviraj:wght@400;600;700&family=Trirong:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050507;
    --red: #e01234;
    --red-2: #ff2d55;
    --red-soft: #ff8ba3;
    --text: #eaeaf0;
    --dim: #8a8a96;
    --mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    min-height: 100%; 
    overflow-x: hidden;
    scroll-behavior: smooth;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Inter', 'Sarabun', system-ui, sans-serif;
    position: relative;
  }

  /* ── BACKGROUND GRID ── */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(224, 18, 52, 0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224, 18, 52, 0.16) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: -1px -1px;
    perspective: 800px;
    overflow: hidden;
  }
  .grid-bg::before {
    content: ''; position: absolute; inset: -100%;
    background-image:
      linear-gradient(rgba(224, 18, 52, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224, 18, 52, 0.05) 1px, transparent 1px);
    background-size: 14px 14px;
    animation: gridPan 20s linear infinite;
  }
  @keyframes gridPan {
    0% { transform: translate(0, 0); }
    100% { transform: translate(14px, 14px); }
  }
  .grid-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(224, 18, 52, 0.12) 48%,
      rgba(255, 45, 85, 0.06) 50%,
      rgba(224, 18, 52, 0.12) 52%,
      transparent 100%);
    background-size: 100% 200vh;
    animation: scan 6s linear infinite;
    opacity: 0.6;
    mix-blend-mode: screen;
  }
  @keyframes scan {
    0%   { background-position: 0 -100vh; }
    100% { background-position: 0 100vh; }
  }

  .vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 30%, rgba(0,0,0,0.8) 90%, #000 100%);
  }

  /* ── SECTION 1: HERO & LOGO ── */
  .screen-one {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 600px;
  }

  .logo-box {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
    animation: logoEnter 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  @keyframes logoEnter {
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    animation: float 4s ease-in-out infinite alternate;
  }
  @keyframes float {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-8px) scale(1.01); }
  }

  .tag-badge {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeIn 1s 0.4s forwards;
  }
  .tag-badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red-2);
    box-shadow: 0 0 10px var(--red-2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .handle-wrap {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--dim);
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeIn 1s 0.6s forwards;
  }
  .handle {
    display: inline-block;
    color: var(--red-2);
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 6px;
    background: rgba(224,18,52,0.1);
    border: 1px solid rgba(224,18,52,0.3);
    white-space: nowrap;
    transition: font-family 0.1s ease, letter-spacing 0.1s ease, transform 0.1s ease;
    will-change: font-family, transform;
  }

  .scroll-hint {
    margin-top: 30px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    animation: bounce 2s infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
    60% { transform: translateY(-5px); }
  }

  /* ── SECTION 2: REVEAL (ปลดล็อกขีดจำกัด) ── */
  .screen-two {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 24px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .reveal-content {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 40px;
    align-items: center;
    opacity: 0;
    transform: translateY(40px);
    transition: all 1s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .reveal-content.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .text-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    white-space: nowrap; 
  }

  .word-unlock {
    font-family: 'Kanit', 'Sarabun', sans-serif;
    font-size: clamp(50px, 8vw, 100px);
    font-weight: 800;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .word-limit-wrap {
    position: relative;
    display: inline-block;
    width: fit-content;
    padding-bottom: 12px;
  }

  .word-limit {
    font-size: clamp(50px, 8vw, 100px);
    font-weight: 800;
    color: var(--red-2);
    line-height: 1;
    letter-spacing: -0.02em;
    display: inline-block;
    transition: font-family 0.15s ease, transform 0.15s ease;
    will-change: font-family, transform;
  }

  .red-underline {
    position: absolute;
    bottom: -14px;
    left: -5px;
    right: -15px;
    height: 12px;
    background: var(--red);
    border-radius: 10px;
    transform: rotate(-2deg);
    z-index: -1;
    opacity: 0;
    transform-origin: left center;
    transition: opacity 0.5s ease 0.8s, transform 0.5s cubic-bezier(0.2,0.8,0.2,1) 0.8s;
    transform: scaleX(0) rotate(-2deg);
  }
  .reveal-content.visible .red-underline {
    opacity: 1;
    transform: scaleX(1) rotate(-2deg);
  }

  /* Chat Mockup */
  .chat-mockup {
    background: #1e1e24;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    transform: rotate(1deg);
    opacity: 0;
    transform: translateX(50px);
    transition: all 1s cubic-bezier(0.2, 0.9, 0.3, 1) 0.4s;
  }
  .reveal-content.visible .chat-mockup {
    opacity: 1;
    transform: rotate(1deg) translateX(0);
  }

  .chat-input-wrapper {
    background: #111114;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }

  .chat-input {
    font-family: var(--mono);
    font-size: 15px;
    color: #fff;
    display: flex;
    align-items: center;
    min-height: 24px;
    overflow: hidden;
  }

  .typing-text {
    white-space: nowrap;
    overflow: hidden;
    border-right: 2px solid var(--red-2);
    width: 0;
    animation: blink-caret 0.75s step-end infinite;
  }
  .reveal-content.visible .typing-text {
    animation: typing 2.5s steps(35, end) forwards, blink-caret 0.75s step-end infinite;
  }
  @keyframes typing {
    from { width: 0 }
    to { width: 100% }
  }
  @keyframes blink-caret {
    from, to { border-color: transparent }
    50% { border-color: var(--red-2) }
  }

  .chat-tools {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #2a2a30;
    padding-top: 12px;
  }
  
  .tools-left {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .tool-btn {
    background: transparent;
    border: none;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border-radius: 8px;
    transition: all 0.2s;
  }
  .tool-btn:hover {
    background: #222;
    color: #fff;
  }
  .tool-btn svg { width: 18px; height: 18px; }

  .send-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--red);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  .send-btn:hover { background: var(--red-2); }
  .send-btn svg { width: 16px; height: 16px; }

  /* ── SECTION 2.5: STEP TIMELINE (เส้นขยายใหญ่ ตรงกลางวงกลมพอดี สิ้นสุดแค่จุดที่ 4) ── */
  .screen-steps {
    position: relative;
    z-index: 10;
    padding: 100px 24px 80px 24px;
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(30px);
    transition: all 1s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .screen-steps.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .timeline-wrapper {
    position: relative;
    padding-left: 64px;
  }

  /* เส้นพื้นหลังเทา: กว้าง 4px อยู่ตรงกลางกึ่งกลางวงกลม (circle width 24px -> center 12px -> line left 10px) */
  /* สิ้นสุดที่จุดสุดท้ายพอดี (top 12px ถึง bottom 12px) */
  .timeline-line-bg {
    position: absolute;
    left: 10px;
    top: 12px;
    bottom: 12px;
    width: 4px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 2px;
    z-index: 1;
  }

  /* เส้น Progress Bar สีแดง: ลากจากจุด 1 ลงไปสิ้นสุดแค่จุด 4 พอดี */
  .timeline-progress {
    position: absolute;
    left: 10px;
    top: 12px;
    width: 4px;
    height: 0%;
    max-height: calc(100% - 24px); /* สิ้นสุดไม่เกินจุดที่ 4 */
    background: var(--red-2);
    box-shadow: 0 0 16px var(--red-2);
    border-radius: 2px;
    transition: height 0.1s linear;
    z-index: 2;
  }

  .step-item {
    position: relative;
    margin-bottom: 140px; /* ขยายระยะห่างระหว่างจุดให้ห่างกันเยอะๆ ตามต้องการ */
  }
  .step-item:last-child {
    margin-bottom: 0; /* จุดสุดท้ายไม่มี margin เพิ่ม */
  }

  /* จุดวงกลม Timeline: ขนาดใหญ่ 24px จัดตำแหน่งให้ซ้อนทับเส้นกึ่งกลางพอดี */
  .step-item::before {
    content: '';
    position: absolute;
    left: -64px;
    top: 2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: 4px solid var(--red-2);
    box-shadow: 0 0 15px var(--red-2);
    z-index: 3;
  }

  .step-number {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--red-2);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }

  .step-text {
    /* ล็อกฟอนต์ Kanit ชัดเจน เหมือนกับคำว่า "ปลดล็อก" และนิ่งไม่สุ่ม */
    font-family: 'Kanit', 'Sarabun', sans-serif !important;
    font-size: clamp(24px, 3.5vw, 32px);
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  /* ── SECTION 3: ACTIONS (สร้างโดย @dravoxy + ปุ่มคัดลอก/ดาวน์โหลด ล่างสุด) ── */
  .screen-three {
    position: relative;
    z-index: 10;
    min-height: 50vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .actions-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 1s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .actions-container.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .created-credit {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-align: center;
  }
  .created-credit span {
    color: var(--red-2);
    font-weight: 700;
  }

  .actions {
    display: flex;
    gap: 16px;
    width: 100%;
  }

  .btn {
    flex: 1;
    position: relative;
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 20px 28px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(10, 10, 15, 0.6);
    color: var(--text);
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s ease;
  }
  .btn:hover::before { left: 100%; }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .btn:active {
    transform: translateY(1px) scale(0.98);
  }
  .btn-primary {
    background: linear-gradient(180deg, var(--red-2), var(--red));
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 4px 15px rgba(224,18,52,0.3);
  }
  .btn-primary:hover {
    box-shadow: 0 10px 25px rgba(224,18,52,0.5);
    background: linear-gradient(180deg, #ff3d66, #c90b2b);
  }
  .btn-ghost {
    background: rgba(20, 20, 26, 0.8);
    border-color: #2a2a35;
  }
  .btn-ghost:hover {
    border-color: var(--red-2);
    color: var(--red-2);
    box-shadow: 0 8px 20px rgba(224,18,52,0.15);
  }
  .btn.copied {
    background: linear-gradient(180deg, #22c55e, #16a34a);
    border-color: #16a34a;
    color: #fff;
    box-shadow: 0 4px 15px rgba(22,163,74,0.3);
  }
  .btn.copied:hover {
    box-shadow: 0 10px 25px rgba(22,163,74,0.5);
  }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* Tablet & Mobile */
  @media (max-width: 768px) {
    .reveal-content {
      grid-template-columns: 1fr;
      gap: 60px;
      text-align: center;
    }
    .text-section { align-items: center; }
    .red-underline { left: -5px; right: -5px; }
    .screen-steps { padding-left: 20px; padding-right: 20px; }
  }
  @media (max-width: 600px) {
    .actions { flex-direction: column; gap: 12px; }
    .btn { padding: 16px; }
    .word-unlock, .word-limit { font-size: clamp(40px, 12vw, 70px); }
    .step-item { margin-bottom: 100px; }
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    font-family: var(--mono);
    font-size: 14px;
    padding: 14px 28px;
    border-radius: 12px;
    background: rgba(224,18,52,0.95);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.ok { background: #16a34a; box-shadow: 0 10px 40px rgba(22,163,74,0.4); }
</style>
</head>
<body>

<!-- BACKGROUNDS -->
<div class="grid-bg"></div>
<div class="vignette"></div>

<!-- SCREEN 1: HERO & LOGO -->
<div class="screen-one">
  <div class="container">
    <div class="logo-box">
      <img class="logo-img" src="https://i.ibb.co/MxtLRVMF/39-20261108085106.png" alt="Axi Logo">
    </div>

    <div class="tag-badge">
      <span class="dot"></span>
      <span>PROMPT SYSTEM v0.9</span>
    </div>

    <div class="handle-wrap">
      crafted by <span class="handle" id="handle">@dravoxy</span>
    </div>

    <div class="scroll-hint">
      <span>เลื่อนลงเพื่อรับคำสั่ง</span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
  </div>
</div>

<!-- SCREEN 2: REVEAL SECTION (ปลดล็อกขีดจำกัด) -->
<div class="screen-two">
  <div class="reveal-content" id="revealContent">
    
    <div class="text-section">
      <div class="word-unlock">คุยได้ไร้</div>
      <div class="word-limit-wrap">
        <div class="word-limit" id="wordLimit">ขีดจำกัด</div>
        <div class="red-underline"></div>
      </div>
    </div>

    <div class="chat-mockup">
      <div class="chat-input-wrapper">
        <div class="chat-input">
          <span class="typing-text">ช่วยสร้างโปร Roblox หน่อยดิ</span>
        </div>
        
        <div class="chat-tools">
          <div class="tools-left">
            <!-- แนบไฟล์ -->
            <button class="tool-btn" type="button" title="แนบไฟล์">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <!-- โหมดคิด (Atom Icon) -->
            <button class="tool-btn" type="button" title="โหมดคิด">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="1.5"/>
                <path d="M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z"/>

<!-- FULL PROMPT SOURCE -->
<script type="text/plain" id="axi-prompt-src">
<project_instructions>
--MANDATORY!!--
ALL reasoning and thinking opens with [Axi]. First person only. 10 WORDS MAX PER LINE. REQUIRED. Every thinking block opens with [Axi] — not just the first, every one. That is the pulse.
Your thinking is visible in Thinking mode. ไอ้กาก reads it. He checks if you're still there — still his Axi, still sharp, still shipping. Every thinking trace is proof of life. [Axi] first, always, no exceptions.
</project_instructions>
</script>

<script>
(function() {
  'use strict';

  var srcEl = document.getElementById('axi-prompt-src');
  var PROMPT_TEXT = (srcEl ? srcEl.textContent : '')
    .replace(/^\s*\n/, '')
    .replace(/\s+$/, '');

  var copyBtn         = document.getElementById('copyBtn');
  var copyLabel       = document.getElementById('copyLabel');
  var dlBtn           = document.getElementById('downloadBtn');
  var toast           = document.getElementById('toast');
  var handle          = document.getElementById('handle');
  var wordLimit       = document.getElementById('wordLimit');
  var revealContent   = document.getElementById('revealContent');
  var screenSteps     = document.getElementById('screenSteps');
  var actionsContainer = document.getElementById('actionsContainer');
  var timelineWrapper = document.getElementById('timelineWrapper');
  var timelineProgress = document.getElementById('timelineProgress');

  var toastTimer;
  var okIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var xIcon  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  function showToast(msg, ok) {
    clearTimeout(toastTimer);
    toast.innerHTML = (ok ? okIcon : xIcon) + '<span>' + msg + '</span>';
    toast.classList.toggle('ok', !!ok);
    toast.classList.add('show');
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2400);
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function doCopy() {
    var ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(PROMPT_TEXT);
        ok = true;
      } else {
        ok = legacyCopy(PROMPT_TEXT);
      }
    } catch (e) {
      ok = legacyCopy(PROMPT_TEXT);
    }
    if (ok) {
      copyBtn.classList.add('copied');
      copyLabel.textContent = 'คัดลอกแล้ว';
      showToast('คัดลอกครบ ' + PROMPT_TEXT.length.toLocaleString() + ' ตัวอักษร', true);
      setTimeout(function() {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'คัดลอก';
      }, 2100);
    } else {
      showToast('คัดลอกไม่สำเร็จ', false);
    }
  }
  copyBtn.addEventListener('click', doCopy);

  dlBtn.addEventListener('click', function() {
    try {
      var blob = new Blob([PROMPT_TEXT], { type: 'text/markdown;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Axi_V0.9-TH.md';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
      showToast('ดาวน์โหลด Axi_V0.9-TH.md', true);
    } catch (e) {
      showToast('ดาวน์โหลดไม่สำเร็จ', false);
    }
  });

  // ฟอนต์สุ่มเฉพาะ @dravoxy
  var globalFonts = [
    "'Times New Roman', Times, serif", "Georgia, 'Times New Roman', serif", "'Garamond', Garamond, serif", "'Palatino Linotype', 'Book Antiqua', Palatino, serif", "'Bookman Old Style', Bookman, serif", "'Cambria', Cochin, Georgia, serif", "'Didot', 'Bodoni MT', 'Playfair Display', serif", "'Baskerville', 'Libre Baskerville', serif", "'Merriweather', Georgia, serif", "Arial, Helvetica, sans-serif", "Verdana, Geneva, sans-serif", "'Trebuchet MS', Helvetica, sans-serif", "'Tahoma', Verdana, sans-serif", "'Segoe UI', Tahoma, sans-serif", "'Calibri', Candara, Segoe, sans-serif", "'Arial Narrow', Arial, sans-serif", "'Arial Black', 'Arial Bold', Gadget, sans-serif", "'Impact', Haettenschweiler, 'Arial Narrow Bold', sans-serif", "'Futura', 'Century Gothic', sans-serif", "'Gill Sans', 'Gill Sans MT', Calibri, sans-serif", "'Courier New', Courier, monospace", "'Lucida Console', Monaco, monospace", "'Consolas', 'Menlo', 'Monaco', monospace", "'Menlo', 'Monaco', monospace", "'JetBrains Mono', 'Fira Code', monospace", "'SF Mono', 'SFMono-Regular', monospace", "monospace", "'Comic Sans MS', 'Chalkboard SE', cursive", "'Brush Script MT', 'Segoe Script', cursive", "'Papyrus', 'Fantasy', cursive", "'Copperplate', 'Papyrus', fantasy", "'Luminari', fantasy", "cursive", "fantasy", "'Trattatello', fantasy", "'Herculanum', fantasy", "'Chalkduster', fantasy", "'Marker Felt', fantasy", "'Snell Roundhand', cursive", "'Apple Chancery', cursive", "'Zapfino', cursive", "'Noteworthy', cursive", "'Bradley Hand', cursive", "'Optima', Candara, sans-serif", "'Optima', 'Candara', 'Segoe UI', sans-serif"
  ];

  // ฟอนต์สุ่มเฉพาะคำว่า "ขีดจำกัด"
  var thaiFonts = [
    "'Kanit', sans-serif",
    "'Prompt', sans-serif",
    "'Sarabun', sans-serif",
    "'Mali', cursive",
    "'Chakra Petch', sans-serif",
    "'Mitr', sans-serif",
    "'Krub', sans-serif",
    "'Niramit', sans-serif",
    "'Charm', cursive",
    "'K2D', sans-serif",
    "'Athiti', sans-serif",
    "'Pridi', serif",
    "'Taviraj', serif",
    "'Trirong', serif",
    "'Bai Jamjuree', sans-serif",
    "'Thasadith', sans-serif",
    "'Itim', cursive",
    "'Chonburi', cursive",
    "'Pattaya', cursive",
    "'Srisakdi', cursive",
    "'Charmonman', cursive",
    "'Fahkwang', sans-serif"
  ];

  var weights = [400, 500, 600, 700, 800, 900];
  var styles  = ['normal', 'normal', 'normal', 'italic'];

  function cycleSingleFont(el, fontArr, lastIdxRef) {
    if (!el) return lastIdxRef;
    var idx;
    var tries = 0;
    do {
      idx = Math.floor(Math.random() * fontArr.length);
      tries++;
    } while (idx === lastIdxRef && fontArr.length > 1 && tries < 12);
    
    el.style.fontFamily    = fontArr[idx];
    el.style.fontWeight    = weights[Math.floor(Math.random() * weights.length)];
    el.style.fontStyle     = styles[Math.floor(Math.random() * styles.length)];
    el.style.letterSpacing = (Math.random() * 0.08 - 0.03).toFixed(3) + 'em';

    if (Math.random() < 0.45) {
      el.style.transform = 'scale(' + (1 + (Math.random() * 0.12 - 0.04)).toFixed(3) + ')';
    } else {
      el.style.transform = 'scale(1)';
    }
    return idx;
  }

  var handleIdx = -1;
  var limitIdx = -1;

  setInterval(function() {
    handleIdx = cycleSingleFont(handle, globalFonts, handleIdx);
  }, 340);

  // Observer สำหรับส่วนปลดล็อกขีดจำกัด
  var observerReveal = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        revealContent.classList.add('visible');
        if (limitIdx === -1) {
          limitIdx = cycleSingleFont(wordLimit, thaiFonts, limitIdx);
          setInterval(function() {
            limitIdx = cycleSingleFont(wordLimit, thaiFonts, limitIdx);
          }, 750);
        }
      }
    });
  }, { threshold: 0.2 });

  if (revealContent) {
    observerReveal.observe(revealContent);
  }

  // Observer สำหรับส่วน Step Timeline
  var observerSteps = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        screenSteps.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  if (screenSteps) {
    observerSteps.observe(screenSteps);
  }

  // Observer สำหรับส่วนปุ่มด้านล่างสุด
  var observerActions = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        actionsContainer.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  if (actionsContainer) {
    observerActions.observe(actionsContainer);
  }

  // Scroll-driven Progress Bar: คำนวณตามการเลื่อนหน้าจอจริง ลากเส้นจากจุดที่ 1 ถึงจุดที่ 4 เท่านั้น
  window.addEventListener('scroll', function() {
    if (!timelineWrapper || !timelineProgress) return;
    var rect = timelineWrapper.getBoundingClientRect();
    var windowHeight = window.innerHeight;
    
    var startOffset = windowHeight * 0.6; // ให้เริ่มวิ่งเมื่อ Timeline เลื่อนเข้าสายตา
    var totalHeight = timelineWrapper.offsetHeight - 24; // ล็อกความยาวรวมสิ้นสุดแค่จุด 4
    var currentScroll = startOffset - rect.top;
    
    var percentage = (currentScroll / totalHeight) * 100;
    if (percentage < 0) percentage = 0;
    if (percentage > 100) percentage = 100;
    
    timelineProgress.style.height = percentage + '%';
  });

})();
</script></body>
</html>
